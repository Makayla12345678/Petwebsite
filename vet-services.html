<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vet Services — PetWeb</title>

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="nav-placeholder"></div>

  <main>

      <div id="vets-list" class="vets-list"></div>
